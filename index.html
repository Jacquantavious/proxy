<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Search</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#111318;color:#eee;font:16px system-ui,sans-serif;display:flex;flex-direction:column}
header{padding:12px;display:flex;gap:8px;background:#191b21;border-bottom:1px solid #30333c}
form{display:flex;gap:8px;flex:1;min-width:0}input{flex:1;min-width:0;padding:11px 12px;border:1px solid #343741;border-radius:10px;background:#22252d;color:#eee;font-size:16px;outline:none}
button{border:0;border-radius:9px;padding:0 14px;background:#e7e9ee;color:#15171b;font-weight:600;cursor:pointer}button:hover{background:#fff}
#tabs{display:flex;gap:6px;padding:8px;background:#191b21;overflow-x:auto;border-bottom:1px solid #30333c}.tab{white-space:nowrap;background:#282b33;color:#eee;padding:8px 10px;border-radius:8px;display:flex;gap:8px;align-items:center}.tab.active{background:#3b404b}.tab button{padding:0 4px;background:transparent;color:#ccc;font-size:18px}
#view{flex:1;min-height:55vh;background:#fff}iframe{width:100%;height:100%;min-height:55vh;border:0;background:white}#empty{height:100%;min-height:55vh;display:grid;place-items:center;color:#888;background:#111318}
@media(max-width:500px){header{padding:8px}button{padding:0 11px}}
</style>
</head>
<body>
<header>
<form id="searchForm"><input id="query" autocomplete="off" placeholder="Search or enter a website" aria-label="Search or enter a website"><button type="submit">Go</button></form>
<button id="newTab" type="button" title="New tab">+</button>
</header>
<div id="tabs"></div>
<div id="view"><div id="empty">Enter a search or website above</div></div>
<script>
const form=document.getElementById('searchForm'),input=document.getElementById('query'),tabsEl=document.getElementById('tabs'),view=document.getElementById('view');
let tabs=[],activeId=null,nextId=1;
function destinationFor(value){const urlLike=/^(https?:\/\/)?([\w-]+\.)+[a-z]{2,}([/:?#].*)?$/i.test(value);return urlLike?(value.startsWith('http://')||value.startsWith('https://')?value:'https://'+value):'https://www.google.com/search?q='+encodeURIComponent(value)}
function addTab(url=''){const tab={id:nextId++,url,title:url?new URL(url).hostname:'New tab'};tabs.push(tab);activate(tab.id);renderTabs();if(url)loadTab(tab.id,url)}
function activate(id){activeId=id;const tab=tabs.find(t=>t.id===id);input.value=tab?.url||'';renderTabs();renderView()}
function loadTab(id,url){const tab=tabs.find(t=>t.id===id);if(!tab)return;tab.url=url;try{tab.title=new URL(url).hostname}catch{tab.title='Tab'};if(id===activeId)renderView();renderTabs();}
function renderTabs(){tabsEl.innerHTML='';tabs.forEach(t=>{const el=document.createElement('div');el.className='tab'+(t.id===activeId?' active':'');const label=document.createElement('span');label.textContent=t.title;label.onclick=()=>activate(t.id);const close=document.createElement('button');close.type='button';close.textContent='×';close.title='Close tab';close.onclick=()=>closeTab(t.id);el.append(label,close);tabsEl.append(el)})}
function renderView(){view.innerHTML='';const tab=tabs.find(t=>t.id===activeId);if(!tab||!tab.url){const empty=document.createElement('div');empty.id='empty';empty.textContent='Enter a search or website above';view.append(empty);return}const frame=document.createElement('iframe');frame.title='Embedded website';frame.src=tab.url;frame.referrerPolicy='no-referrer';view.append(frame)}
function closeTab(id){tabs=tabs.filter(t=>t.id!==id);if(!tabs.length){addTab();return}if(activeId===id)activeId=tabs[tabs.length-1].id;renderTabs();renderView();input.value=tabs.find(t=>t.id===activeId)?.url||''}
form.addEventListener('submit',e=>{e.preventDefault();const value=input.value.trim();if(!value)return;const url=destinationFor(value);if(!tabs.length)addTab(url);else loadTab(activeId,url)});
document.getElementById('newTab').addEventListener('click',()=>addTab());addTab();
</script>
</body>
</html>
